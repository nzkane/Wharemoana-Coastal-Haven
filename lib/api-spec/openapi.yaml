openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: enquiries
    description: Guest stay enquiries
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /enquiries:
    post:
      operationId: createStayEnquiry
      tags: [enquiries]
      summary: Send a stay enquiry to the booking workflow
      description: Validates a guest enquiry and forwards it to the configured n8n booking workflow.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StayEnquiryInput"
      responses:
        "200":
          description: Enquiry accepted by the booking workflow
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StayEnquiryResponse"
        "400":
          description: Invalid enquiry details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: The booking workflow could not accept the enquiry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: The booking workflow is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    StayEnquiryInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          maxLength: 254
        checkIn:
          type: string
          format: date
        checkOut:
          type: string
          format: date
        guests:
          type: number
          minimum: 1
          maximum: 20
        message:
          type: string
          minLength: 1
          maxLength: 2000
      required:
        - name
        - email
        - checkIn
        - checkOut
        - guests
        - message
    StayEnquiryResponse:
      type: object
      properties:
        status:
          type: string
          enum: [submitted]
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

